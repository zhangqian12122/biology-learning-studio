name: Deploy to Cloudflare Workers

# 每次 push 到 main 自动构建并部署到 Cloudflare Workers
# 前置条件：在仓库 Settings → Secrets and variables → Actions 中添加：
#   CLOUDFLARE_API_TOKEN  — 具备 Workers / D1 编辑权限的 API Token
#   CLOUDFLARE_ACCOUNT_ID — Cloudflare 账户 ID（可选，账户仅有一个时可不填）
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    # 需要先在仓库 Settings → Secrets 配置 CLOUDFLARE_API_TOKEN，
    # 并在 Settings → Secrets and variables → Actions → Variables 添加 CLOUDFLARE_DEPLOY_ENABLED=1 启用本工作流
    if: vars.CLOUDFLARE_DEPLOY_ENABLED == '1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Resolve D1 database (create if missing)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node scripts/resolve-d1.mjs

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config dist/server/wrangler.json
